<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="MCP Server Suite for Claude Code">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3c4043" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f3f4"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "Google Sans","Product Sans","Segoe UI",Roboto,Arial,sans-serif; }
    .t { fill:#202124; font-weight:600; }
    .s { fill:#5f6368; }
  </style>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Google color bar -->
  <rect x="0" y="0" width="400" height="10" fill="#4285F4"/>
  <rect x="400" y="0" width="400" height="10" fill="#EA4335"/>
  <rect x="800" y="0" width="400" height="10" fill="#FBBC05"/>
  <rect x="1200" y="0" width="400" height="10" fill="#34A853"/>

  <!-- Title -->
  <text x="800" y="118" text-anchor="middle" font-size="64" class="t">
    <tspan fill="#4285F4">M</tspan><tspan fill="#EA4335">C</tspan><tspan fill="#FBBC05">P</tspan>
    <tspan fill="#202124"> Server </tspan><tspan fill="#34A853">Suite</tspan>
  </text>
  <text x="800" y="170" text-anchor="middle" font-size="28" class="s">Model Context Protocol tools for Claude Code</text>

  <!-- Connectors -->
  <g fill="none" stroke-width="4" stroke-linecap="round">
    <path d="M800 400 C800 450 300 430 300 520" stroke="#4285F4"/>
    <path d="M800 400 L800 520" stroke="#EA4335"/>
    <path d="M800 400 C800 450 1300 430 1300 520" stroke="#34A853"/>
  </g>

  <!-- Claude Code hub -->
  <g filter="url(#sh)">
    <rect x="600" y="260" width="400" height="140" rx="28" fill="#fff"/>
  </g>
  <rect x="600" y="260" width="400" height="140" rx="28" fill="none" stroke="#FBBC05" stroke-width="4"/>
  <text x="800" y="322" text-anchor="middle" font-size="40" class="t">Claude Code</text>
  <text x="800" y="364" text-anchor="middle" font-size="24" class="s">MCP client · stdio transport</text>

  <!-- Server cards -->
  <g filter="url(#sh)">
    <rect x="100" y="520" width="400" height="230" rx="24" fill="#fff"/>
    <rect x="600" y="520" width="400" height="230" rx="24" fill="#fff"/>
    <rect x="1100" y="520" width="400" height="230" rx="24" fill="#fff"/>
  </g>
  <rect x="100" y="520" width="400" height="12" rx="6" fill="#4285F4"/>
  <rect x="600" y="520" width="400" height="12" rx="6" fill="#EA4335"/>
  <rect x="1100" y="520" width="400" height="12" rx="6" fill="#34A853"/>

  <circle cx="160" cy="596" r="26" fill="#E8F0FE"/><text x="160" y="607" text-anchor="middle" font-size="30" font-weight="700" fill="#4285F4">1</text>
  <text x="206" y="606" font-size="32" class="t">Dev Tools</text>
  <text x="130" y="660" font-size="23" class="s">File reading · code search</text>
  <text x="130" y="696" font-size="23" class="s">Git info · review checklists</text>

  <circle cx="660" cy="596" r="26" fill="#FCE8E6"/><text x="660" y="607" text-anchor="middle" font-size="30" font-weight="700" fill="#EA4335">2</text>
  <text x="706" y="606" font-size="32" class="t">Supabase</text>
  <text x="630" y="660" font-size="23" class="s">Live DB queries · usage stats</text>
  <text x="630" y="696" font-size="23" class="s">Memory search · record insert</text>

  <circle cx="1160" cy="596" r="26" fill="#E6F4EA"/><text x="1160" y="607" text-anchor="middle" font-size="30" font-weight="700" fill="#34A853">3</text>
  <text x="1206" y="606" font-size="32" class="t">Client Project</text>
  <text x="1130" y="660" font-size="23" class="s">Summary · TODO detection · env audit</text>
  <text x="1130" y="696" font-size="23" class="s">Components · API route analysis</text>

  <!-- Stack chips -->
  <g font-size="22" text-anchor="middle" class="t">
    <rect x="320" y="800" width="130" height="46" rx="23" fill="#E8F0FE"/><text x="385" y="831" fill="#1A73E8">Node.js</text>
    <rect x="470" y="800" width="330" height="46" rx="23" fill="#FCE8E6"/><text x="635" y="831" fill="#C5221F">@modelcontextprotocol/sdk</text>
    <rect x="820" y="800" width="150" height="46" rx="23" fill="#E6F4EA"/><text x="895" y="831" fill="#137333">Supabase</text>
    <rect x="990" y="800" width="100" height="46" rx="23" fill="#FEF7E0"/><text x="1040" y="831" fill="#B06000">Zod</text>
    <rect x="1110" y="800" width="170" height="46" rx="23" fill="#F1F3F4"/><text x="1195" y="831" fill="#3C4043">ES modules</text>
  </g>
</svg>
